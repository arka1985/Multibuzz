<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multibuzz - Participant Buzzer</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- PeerJS for WebRTC real-time connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .color-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }
        .color-choice {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .color-choice:hover {
            transform: scale(1.15);
        }
        .color-choice.selected {
            border-color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- 1. JOIN SCREEN (Initial View) -->
    <div id="join-screen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;">
        <div class="glass-panel" style="max-width: 400px; width: 100%; padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem;">
            <div style="text-align: center;">
                <div class="brand-icon" style="margin: 0 auto 0.75rem auto; width: 48px; height: 48px; font-size: 1.5rem;">⚡</div>
                <h1 style="font-size: 1.5rem; font-weight: 800;">Join Multibuzz</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                    Enter your room code and team name to buzz in
                </p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase;">Room Code</label>
                <input id="input-room-code" type="text" placeholder="e.g. 7X9K2P" maxlength="8" class="mono-timer" style="padding: 12px; border-radius: 10px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-bright); color: var(--text-main); font-size: 1.25rem; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.1em; outline: none;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase;">Team / Player Name</label>
                <input id="input-player-name" type="text" placeholder="e.g. Speed Demons" maxlength="24" style="padding: 12px; border-radius: 10px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-bright); color: var(--text-main); font-size: 1rem; font-weight: 600; outline: none;">
            </div>

            <div>
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; text-align: center; display: block;">Pick Team Color</label>
                <div class="color-selector">
                    <div class="color-choice selected" data-color="#6366f1" style="background: #6366f1;"></div>
                    <div class="color-choice" data-color="#38bdf8" style="background: #38bdf8;"></div>
                    <div class="color-choice" data-color="#10b981" style="background: #10b981;"></div>
                    <div class="color-choice" data-color="#f59e0b" style="background: #f59e0b;"></div>
                    <div class="color-choice" data-color="#ec4899" style="background: #ec4899;"></div>
                    <div class="color-choice" data-color="#ef4444" style="background: #ef4444;"></div>
                </div>
            </div>

            <button id="btn-join-room" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                🚀 Enter Buzzer
            </button>
        </div>
    </div>

    <!-- 2. BUZZER SCREEN (Active Game View) -->
    <div id="buzzer-screen" style="display: none; flex-direction: column; flex: 1;">
        <!-- Top status bar -->
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="brand-icon" style="width: 28px; height: 28px; font-size: 0.9rem;">⚡</span>
                <div>
                    <span id="header-player-name" style="font-weight: 700; font-size: 1rem;">Team</span>
                    <span style="font-size: 0.75rem; color: var(--text-dim); margin-left: 6px;">
                        Room: <strong id="header-room-code" class="mono-timer" style="color: #38bdf8;">------</strong>
                    </span>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="connection-status" style="font-size: 0.75rem; color: #10b981; font-weight: 600;">
                    ● Live
                </span>
                <button id="btn-sound-toggle" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;">
                    🔊 Sound
                </button>
            </div>
        </header>

        <!-- Main Giant Tactile Buzzer Area -->
        <main class="buzzer-stage">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2 id="buzzer-status-text" style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em;">
                    🔒 LOCKED
                </h2>
                <p id="buzzer-subtext" style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">
                    Wait for host to read question...
                </p>
            </div>

            <!-- Tactile 3D Circular Buzzer Button -->
            <div id="buzzer-housing" class="buzzer-housing locked-glow">
                <button id="buzzer-button" class="buzzer-button state-locked" aria-label="Buzzer Button">
                    <span style="font-size: 2.75rem; pointer-events: none;">🔔</span>
                    <span style="font-size: 1.35rem; font-weight: 900; pointer-events: none;">BUZZ</span>
                </button>
            </div>

            <!-- Buzz Result Feedback Card (Shows your millisecond rank) -->
            <div id="buzzer-result-card" class="glass-panel" style="display: none; margin-top: 2rem; width: 100%; max-width: 320px; padding: 1rem 1.25rem; align-items: center; justify-content: space-between; animation: slideIn 0.3s ease;">
                <div>
                    <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700;">Your Position</div>
                    <div id="result-rank-badge" style="font-size: 1.25rem; font-weight: 800; color: #fbbf24;">
                        🥇 1st Place!
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700;">Reaction Time</div>
                    <div id="result-time-text" class="mono-timer" style="font-size: 1.3rem; font-weight: 800; color: #38bdf8;">
                        0.000s
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/time-sync.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
