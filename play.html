<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multibuzz - Buzzer</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        .color-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 6px 0;
        }
        .color-choice {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .color-choice.selected {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- 1. JOIN SCREEN -->
    <div id="join-screen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;">
        <div class="glass-panel" style="max-width: 360px; width: 100%; padding: 1.75rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="text-align: center;">
                <div class="brand-icon" style="margin: 0 auto 0.5rem auto;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.35rem; font-weight: 800;">Multibuzz</h1>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px;">
                <input id="input-room-code" type="text" placeholder="ROOM CODE" maxlength="8" class="mono-timer" style="padding: 12px; border-radius: 10px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-bright); color: var(--text-main); font-size: 1.25rem; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.1em; outline: none;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px;">
                <input id="input-player-name" type="text" placeholder="Your Name / Team" maxlength="24" style="padding: 12px; border-radius: 10px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-bright); color: var(--text-main); font-size: 1rem; font-weight: 600; outline: none;">
            </div>

            <div class="color-selector">
                <div class="color-choice selected" data-color="#6366f1" style="background: #6366f1;"></div>
                <div class="color-choice" data-color="#38bdf8" style="background: #38bdf8;"></div>
                <div class="color-choice" data-color="#10b981" style="background: #10b981;"></div>
                <div class="color-choice" data-color="#f59e0b" style="background: #f59e0b;"></div>
                <div class="color-choice" data-color="#ec4899" style="background: #ec4899;"></div>
                <div class="color-choice" data-color="#ef4444" style="background: #ef4444;"></div>
            </div>

            <button id="btn-join-room" class="btn btn-primary btn-lg" style="width: 100%;">
                Enter Buzzer
            </button>
        </div>
    </div>

    <!-- 2. BUZZER SCREEN -->
    <div id="buzzer-screen" style="display: none; flex-direction: column; flex: 1;">
        <header>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="brand-icon" style="width: 26px; height: 26px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </span>
                <span id="header-player-name" style="font-weight: 700; font-size: 0.95rem;">Team</span>
                <span id="header-room-code" class="mono-timer" style="font-size: 0.8rem; color: #38bdf8;">------</span>
            </div>

            <div style="display: flex; align-items: center; gap: 6px;">
                <span id="connection-status" style="font-size: 0.75rem; color: #10b981; font-weight: 600;">● Live</span>
                <button id="btn-sound-toggle" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="buzzer-stage">
            <h2 id="buzzer-status-text" style="font-size: 1.75rem; font-weight: 800; margin-bottom: 1.5rem;">
                LOCKED
            </h2>

            <!-- Buzzer Button -->
            <div id="buzzer-housing" class="buzzer-housing locked-glow">
                <button id="buzzer-button" class="buzzer-button state-locked" aria-label="Buzzer Button">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none; opacity: 0.9;">
                        <circle cx="12" cy="12" r="9"></circle>
                        <circle cx="12" cy="12" r="3.5"></circle>
                    </svg>
                    <span style="font-size: 1.4rem; font-weight: 900; pointer-events: none; letter-spacing: 0.05em;">BUZZ</span>
                </button>
            </div>

            <!-- Buzz Result Badge -->
            <div id="buzzer-result-card" class="glass-panel" style="display: none; margin-top: 1.75rem; width: 100%; max-width: 280px; padding: 0.75rem 1.25rem; align-items: center; justify-content: space-between;">
                <div id="result-rank-badge" style="font-size: 1.25rem; font-weight: 800; color: #fbbf24;">
                    #1
                </div>
                <div id="result-time-text" class="mono-timer" style="font-size: 1.25rem; font-weight: 800; color: #38bdf8;">
                    0.000s
                </div>
            </div>
        </main>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/time-sync.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
