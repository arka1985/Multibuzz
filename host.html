<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multibuzz - Host</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <div class="brand-icon">⚡</div>
            <span>Multibuzz <span style="font-size: 0.75rem; opacity: 0.7;">HOST</span></span>
        </a>

        <div style="display: flex; align-items: center; gap: 8px;">
            <!-- Room Code -->
            <div style="display: flex; align-items: center; background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-bright); padding: 4px 10px; border-radius: 10px; gap: 8px;">
                <span id="room-code-display" class="mono-timer" style="font-weight: 800; font-size: 1.15rem; color: #38bdf8; letter-spacing: 0.08em;">------</span>
                <button id="btn-show-qr" class="btn btn-outline btn-icon" style="height: 28px; width: 28px; padding: 0;" title="QR Code">
                    📱
                </button>
            </div>

            <!-- Participants Roster -->
            <button id="btn-show-participants" class="btn btn-outline" style="padding: 6px 10px; font-size: 0.85rem;" title="Connected Participants">
                👥 <span id="participant-count">0</span>
            </button>

            <!-- Scoreboard -->
            <button id="btn-show-scoreboard" class="btn btn-outline" style="padding: 6px 10px; font-size: 0.85rem;" title="Scoreboard">
                🏆 Scores
            </button>

            <!-- Sound Toggle -->
            <button id="btn-sound-toggle" class="btn btn-outline" style="padding: 6px 10px; font-size: 0.85rem;">
                🔊 ON
            </button>
        </div>
    </header>

    <main style="max-width: 900px; width: 100%; margin: 1rem auto; padding: 0 1rem; flex: 1; display: flex; flex-direction: column; gap: 1rem;">
        
        <!-- Controls & Timer -->
        <section class="glass-panel" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="status-badge" class="badge-live" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3);">
                        LOCKED
                    </span>
                    <span style="font-size: 0.9rem; font-weight: 700; color: var(--text-dim);">
                        Q<span id="question-number" style="color: var(--text-main);">1</span>
                    </span>
                </div>

                <!-- Millisecond Live Timer -->
                <div id="timer-display" class="mono-timer" style="font-size: 2.5rem; font-weight: 800; color: #38bdf8; line-height: 1;">
                    0.000s
                </div>
            </div>

            <!-- Action Buttons -->
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="btn-toggle-buzzer" class="btn btn-success btn-lg" style="flex: 2; min-width: 180px;">
                    ⚡ Unlock (Space)
                </button>
                <button id="btn-reset-round" class="btn btn-primary" style="flex: 1; min-width: 120px;">
                    Next Q (R)
                </button>
                <button id="btn-clear-buzzes" class="btn btn-outline" style="min-width: 90px;">
                    Clear (C)
                </button>
                <button id="btn-simulate-buzz" class="btn btn-outline" style="min-width: 80px;" title="Simulate 4 buzzes for testing">
                    🤖 Test
                </button>
            </div>
        </section>

        <!-- Live Sequence -->
        <section class="glass-panel" style="padding: 1.25rem; flex: 1; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
                <span style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em;">Buzz Sequence</span>
                <span style="font-size: 0.75rem; color: #38bdf8; font-weight: 600;">1 ms</span>
            </div>

            <!-- Buzz List Container -->
            <div id="buzz-list-container" class="buzz-list" style="margin-top: 0.5rem;">
                <div id="empty-state" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.95rem;">
                    Waiting for buzzes...
                </div>
            </div>
        </section>
    </main>

    <!-- QR Code Modal -->
    <div id="qr-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px);">
        <div class="glass-panel" style="max-width: 360px; width: 100%; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center;">
            <div class="qr-box">
                <div id="qrcode"></div>
            </div>
            <input id="qr-link-input" type="text" readonly style="width: 100%; padding: 8px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-bright); border-radius: 8px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button id="btn-copy-link" class="btn btn-primary" style="flex: 1;">Copy Link</button>
                <button id="btn-close-qr" class="btn btn-outline" style="flex: 1;">Close</button>
            </div>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div id="scoreboard-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px);">
        <div class="glass-panel" style="max-width: 440px; width: 100%; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700;">Leaderboard</h3>
                <button id="btn-close-scoreboard" class="btn btn-outline btn-icon" style="height:28px; width:28px;">✕</button>
            </div>
            <div style="max-height: 320px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-bright); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase;">
                            <th style="padding: 6px;">#</th>
                            <th style="padding: 6px;">Team</th>
                            <th style="padding: 6px; text-align: right;">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboard-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Participants Modal -->
    <div id="participants-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px);">
        <div class="glass-panel" style="max-width: 440px; width: 100%; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700;">Participants</h3>
                <button id="btn-close-participants" class="btn btn-outline btn-icon" style="height:28px; width:28px;">✕</button>
            </div>
            <div style="max-height: 320px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <tbody id="participants-list-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/time-sync.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/host.js"></script>
</body>
</html>
