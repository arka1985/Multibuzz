<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
    <!-- Outer ambient glow -->
    <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />
    <!-- Outer broadcast wave arcs -->
    <path d="M 120 392 A 192 192 0 0 1 120 120" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" opacity="0.4" />
    <path d="M 392 120 A 192 192 0 0 1 392 392" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" opacity="0.4" />
    <!-- Mid broadcast wave arcs -->
    <path d="M 172 340 A 120 120 0 0 1 172 172" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" opacity="0.75" />
    <path d="M 340 172 A 120 120 0 0 1 340 340" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" opacity="0.75" />
    <!-- Central buzzer core -->
    <circle cx="256" cy="256" r="54" fill="#ffffff" />
    <circle cx="256" cy="256" r="32" fill="#38bdf8" />
</svg>
